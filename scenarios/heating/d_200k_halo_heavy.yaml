# Disk-heating test (Phase 2): MW share (80k) of a 200k budget at dt = 2 Myr, split 70/5/25.
# Provisional MW-like model; not the final MW parameters.
name: heating_d_200k_halo_heavy
seed: 11
simulation:
  t_end_gyr: 2.0
  dt_myr: 2.0
  softening_kpc: 0.15
  solver: tree
  theta: 0.6
  leaf_size: 8
output:
  render:
    every_myr: 100
  checkpoint_every_myr: 500
galaxies:
- name: MW
  spin:
  - 0.0
  - 0.0
  - 1.0
  model:
    vc_method: freeman
    halo:
      mass: 100.0
      scale_radius: 30.0
      r_max: 300.0
      n: 56000
    bulge:
      mass: 1.0
      scale_radius: 0.7
      r_max: 10.0
      n: 4000
    disk:
      mass: 5.0
      scale_length: 2.6
      scale_height: 0.3
      r_max: 25.0
      toomre_q: 1.5
      n: 20000
