# Preview of the 5,000-particle test collision (Checkpoint 1), 1080x1350 (4:5).
run: output/runs/test_collision_5k
out: output/renders/preview_5k
video_name: preview_5k_collision.mp4
width: 1080
height: 1350
fps: 30
crf: 16
frames: {start_gyr: 0.0, end_gyr: 3.0}
camera:                       # presentation only; keyed by simulation time (Gyr)
  key: time_gyr
  target: [0.0, 0.0, 0.0]
  distance_kpc: [[0.0, 330], [0.22, 175], [0.45, 185], [1.0, 225], [1.45, 175], [2.0, 185], [3.0, 205]]
  elevation_deg: [[0.0, 52], [0.4, 40], [1.5, 34], [3.0, 30]]
  azimuth_deg: -55
  azimuth_rate_deg_per_frame: 0.045
  fov_deg: 38
style:
  knn: 24
  kernel_scale: 0.45
  h_max_kpc: 2.5
  density_lo: 2.0e6           # 5k particles: lift the black point above single-particle noise
  density_hi: 2.5e9
  exposure: 1.3
overlay:
  fade_in_frames: 12
  time: {label: "SIMULATED TIME", unit: "billion years", decimals: 2}
  legend: [{name: "Galaxy A", galaxy: 0}, {name: "Galaxy B", galaxy: 1}]
  scale_bar: {kpc: 20}
  tag: {title: "N-BODY SIMULATION", subtitle: "5,000 particles · test galaxies"}
