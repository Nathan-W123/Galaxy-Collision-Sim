# Panel for the prograde/retrograde comparison (1080x674; two panels + a 2 px divider stack to 1080x1350).
run: output/runs/compare_prograde
out: output/renders/compare_prograde
video_name: compare_prograde.mp4
width: 1080
height: 674
fps: 30
crf: 14
frames: {start_gyr: 0.0, end_gyr: 1.6}
camera:
  key: time_gyr
  target: [0.0, 0.0, 0.0]
  distance_kpc: [[0.0, 230], [0.3, 170], [0.8, 230], [1.6, 270]]
  elevation_deg: 75            # looking down on the orbital plane
  azimuth_deg: -90
  azimuth_rate_deg_per_frame: 0.0
  fov_deg: 38
style:                         # look B (decisions D-04), tuned for 20k particles
  knn: 24
  kernel_scale: 0.4
  h_max_kpc: 2.0
  density_lo: 2.0e6
  density_hi: 3.0e9
  exposure: 1.35
  diffuse_weight: 0.8
  clarity: {amount: 0.6, radius_px: 8.0}
  points: {enabled: true, sigma_px: 0.6, gain: 1.3, weight: 0.9}
  bloom: {strength: 0.2, threshold: 0.6, radii: [0.002, 0.006, 0.015], weights: [0.6, 0.3, 0.1]}
overlay:
  margin: 48
  time: {label: "SIMULATED TIME", unit: "billion years", decimals: 2}
  title: {text: "PROGRADE", sub: "disks spin with the orbit"}
  scale_bar: {kpc: 20}
  tag: {title: "N-BODY SIMULATION", subtitle: "20,000 particles · test galaxies"}
