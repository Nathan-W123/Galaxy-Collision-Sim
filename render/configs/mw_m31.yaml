# Milky Way - Andromeda raw collision clip (Checkpoint 2), 1080x1350 (4:5).
# Camera looks onto the orbital plane from an oblique angle.  The orbital angular momentum
# of the vdM2012 canonical orbit points to (az, el) = (-6.3, -57.5) deg.  Presentation only.
run: output/runs/mw_m31_vdm2012
out: output/renders/mw_m31
video_name: mw_m31_collision.mp4
width: 1080
height: 1350
fps: 30
crf: 14
frames: {start_gyr: 0.0, end_gyr: 10.0}
camera:
  key: time_gyr
  target: [0.0, 0.0, 0.0]
  distance_kpc: [[0.0, 1650], [1.0, 1400], [2.0, 1100], [2.5, 900], [3.0, 680], [3.4, 420], [3.65, 260], [3.8, 270], [4.05, 400], [4.4, 440], [4.9, 380], [5.2, 380], [5.6, 420], [6.5, 440], [10.0, 460]]   # from nbody.analysis --camera-keys, smoothed
  elevation_deg: [[0.0, -40], [3.8, -48], [10.0, -55]]
  azimuth_deg: -20
  azimuth_rate_deg_per_frame: 0.02
  roll_deg: -142.5             # makes the MW-M31 separation vertical (Andromeda on top)
  fov_deg: 38
style:                         # look B (decisions D-04)
  knn: 24
  kernel_scale: 0.34
  h_max_kpc: 1.6
  density_lo: 5.0e6           # higher than the preview: the extended merger debris otherwise reads as blotchy haze
  density_hi: 3.0e9
  exposure: 1.35
  diffuse_weight: 0.75
  clarity: {amount: 0.6, radius_px: 8.0}
  points: {enabled: true, sigma_px: 0.6, gain: 1.3, weight: 0.9}
  bloom: {strength: 0.2, threshold: 0.6, radii: [0.002, 0.006, 0.015], weights: [0.6, 0.3, 0.1]}
overlay:
  fade_in_frames: 15
  time: {label: "TIME FROM NOW", unit: "billion years", decimals: 2}
  legend: [{name: "Milky Way", galaxy: 0}, {name: "Andromeda", galaxy: 1}]
  scale_bar: {kpc: [[0.0, 200], [2.7, 50]], fade_gyr: 0.12}
  tag: {title: "N-BODY SIMULATION", subtitle: "100,000 particles · one possible future"}
